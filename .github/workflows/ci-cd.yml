name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        env:
          SECRET_KEY: test-secret-key
          DEBUG: "True"
        run: python manage.py migrate --verbosity=0

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key
          DEBUG: "True"
        run: python manage.py test webhooks --verbosity=2

  deploy-consumer:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy SQS consumer to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            cd /home/${{ secrets.EC2_USER }}/shipment-webhook
            git pull origin main
            source /home/${{ secrets.EC2_USER }}/venv/bin/activate
            pip install -r requirements.txt --quiet
            python manage.py migrate --verbosity=0

            # Stop existing processes
            pkill -f "manage.py runserver" || true
            pkill -f "manage.py consume_webhooks" || true
            sleep 2

            # Start Django API server as daemon (port 8000)
            nohup python manage.py runserver 0.0.0.0:8000 >> /home/${{ secrets.EC2_USER }}/api.log 2>&1 &
            echo "API server started (PID: $!)"

            # Start SQS consumer as daemon
            nohup python manage.py consume_webhooks >> /home/${{ secrets.EC2_USER }}/consumer.log 2>&1 &
            echo "Consumer started (PID: $!)"
