name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        env:
          SECRET_KEY: test-secret-key
          DEBUG: "True"
        run: python manage.py migrate --verbosity=0

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key
          DEBUG: "True"
        run: python manage.py test webhooks --verbosity=2

  deploy-consumer:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy SQS consumer to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            cd /home/${{ secrets.EC2_USER }}/shipment-webhook
            git pull origin main
            source /home/${{ secrets.EC2_USER }}/venv/bin/activate
            pip install -r requirements.txt --quiet
            python manage.py migrate --verbosity=0

            # Copy and reload service files
            sudo cp webhook-api.service /etc/systemd/system/
            sudo cp webhook-consumer.service /etc/systemd/system/
            sudo systemctl daemon-reload

            # Restart both services
            sudo systemctl enable webhook-api webhook-consumer
            sudo systemctl restart webhook-api webhook-consumer

            echo "=== API Server ==="
            sudo systemctl status webhook-api --no-pager
            echo "=== SQS Consumer ==="
            sudo systemctl status webhook-consumer --no-pager
